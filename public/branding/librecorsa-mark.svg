<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="lcb" x1="12" y1="6" x2="116" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1E2B" />
      <stop offset="1" stop-color="#07080C" />
    </linearGradient>
    <linearGradient id="lcv" x1="30" y1="24" x2="96" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2FF4D" />
      <stop offset="1" stop-color="#A6E000" />
    </linearGradient>
    <linearGradient id="lcs" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Badge: chamfered top-left and bottom-right, like a number board -->
  <path d="M28 6H110Q122 6 122 18V98L98 122H18Q6 122 6 110V28Z" fill="url(#lcb)" />
  <path d="M28 6H110Q122 6 122 18V98L98 122H18Q6 122 6 110V28Z" fill="url(#lcs)" />
