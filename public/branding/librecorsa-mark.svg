  <path d="M101 117.5L117.5 101" stroke="#CCFF00" stroke-width="4" stroke-linecap="round" />

  <g transform="translate(13 0) skewX(-12)">
    <!-- L -->
    <path d="M32 26H48V84H96V100H38Q32 100 32 94Z" fill="url(#lcv)" />
    <!-- C, nested in the L's corner like a car at the apex -->
    <path d="M92.32 44.14A20 20 0 1 0 92.32 69.86" stroke="#F5F7FA" stroke-width="12" />
    <!-- Kerb on the apex -->
    <path d="M73.53 76.7A20 20 0 0 1 57.3 53.53" stroke="#FF2A3C" stroke-width="12" stroke-dasharray="5.2 4.2" />
    <!-- Exit streaks -->
    <path d="M101 42H112" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M104 51H110" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
