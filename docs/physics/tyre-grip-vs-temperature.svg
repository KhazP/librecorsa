<text class="tick" x="64" y="382" text-anchor="middle">0</text>
<line class="base" x1="136" y1="364" x2="136" y2="368"/>
<text class="tick" x="136" y="382" text-anchor="middle">25</text>
<line class="base" x1="208.1" y1="364" x2="208.1" y2="368"/>
<text class="tick" x="208.1" y="382" text-anchor="middle">50</text>
