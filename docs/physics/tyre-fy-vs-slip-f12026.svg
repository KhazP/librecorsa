<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">F1 2026 Rigid-Body (f12026-car): lateral force vs slip angle</title>
<desc id="d">Steady-state lateral force of the soft (C3) front tyre of the F1 2026 Rigid-Body (f12026-car) against slip angle at 2, 4, 6 and 8 kN vertical load. Each curve rises to a peak near 6.1 degrees and falls off gently past it; heavier loads give more force but less per newton (load sensitivity).</desc>
