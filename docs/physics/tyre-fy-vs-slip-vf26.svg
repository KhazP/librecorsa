<line x1="64" y1="70" x2="80" y2="70" stroke="var(--r1)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="86" y="74">2 kN</text>
<line x1="131.84" y1="70" x2="147.84" y2="70" stroke="var(--r2)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="153.84" y="74">4 kN</text>
<line x1="199.68" y1="70" x2="215.68" y2="70" stroke="var(--r3)" stroke-width="2" stroke-linecap="round"/>
