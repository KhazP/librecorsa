<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">GT3 sustained lateral g</title>
<desc id="d">GT3 sustained lateral g: the simulator's GT3 against values extracted from real GT3 Evo telemetry at the same speeds, with the tolerance the verify-gt3-telemetry suite enforces on every commit.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--r1:#86b6ef;--r2:#3987e5;--r3:#1c5cab;--r4:#0d366b;--mutedSeries:#898781;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--r1:#1c5cab;--r2:#3987e5;--r3:#86b6ef;--r4:#cde2fb;--mutedSeries:#898781;}}
.ttl{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2);font-size:12px}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.axt{fill:var(--ink2);font-size:12px}
.lbl{fill:var(--ink);font-size:11px}.leg{fill:var(--ink2);font-size:12px}
.grid{stroke:var(--grid);stroke-width:1}.base{stroke:var(--axis);stroke-width:1}
</style>
<rect width="720" height="420" rx="8" fill="var(--surface)"/>
<text class="ttl" x="64" y="28">GT3 sustained lateral g</text>
<text class="sub" x="64" y="48">Mercedes-AMG GT3 model vs reference GT3 Evo MoTeC logs (Valencia, 3 runs)</text>
<line x1="64" y1="70" x2="80" y2="70" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="86" y="74">Simulator</text>
<circle cx="174.64" cy="70" r="4" fill="var(--s2)"/>
<text class="leg" x="188.64" y="74">MoTeC (real car)</text>
<rect x="318" y="64" width="16" height="10" rx="2" fill="var(--s2)" fill-opacity="0.14"/>
<text class="leg" x="340" y="74">CI tolerance −12…+12 %</text>
