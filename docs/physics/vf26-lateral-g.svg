<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">VF26 sustained lateral g vs speed</title>
<desc id="d">Best one-second lateral acceleration of the VF26 on a slow steering ramp at constant speed, against the cornering-limit table that ships with its reference car data. Downforce makes the limit rise with speed.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--r1:#86b6ef;--r2:#3987e5;--r3:#1c5cab;--r4:#0d366b;--mutedSeries:#898781;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--r1:#1c5cab;--r2:#3987e5;--r3:#86b6ef;--r4:#cde2fb;--mutedSeries:#898781;}}
.ttl{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2);font-size:12px}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.axt{fill:var(--ink2);font-size:12px}
.lbl{fill:var(--ink);font-size:11px}.leg{fill:var(--ink2);font-size:12px}
.grid{stroke:var(--grid);stroke-width:1}.base{stroke:var(--axis);stroke-width:1}
</style>
<rect width="720" height="420" rx="8" fill="var(--surface)"/>
<text class="ttl" x="64" y="28">VF26 sustained lateral g vs speed</text>
<text class="sub" x="64" y="48">Simulator (no aids, steer ramp at constant speed) vs the car package's own cornering-limit table</text>
<line x1="64" y1="70" x2="80" y2="70" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="86" y="74">Simulator</text>
<circle cx="174.64" cy="70" r="4" fill="var(--s2)"/>
<text class="leg" x="188.64" y="74">Reference data</text>
<line class="base" x1="64" y1="364" x2="696" y2="364"/>
<text class="tick" x="56" y="368" text-anchor="end">1.6</text>
<line class="grid" x1="64" y1="324.9" x2="696" y2="324.9"/>
<text class="tick" x="56" y="328.9" text-anchor="end">2</text>
<line class="grid" x1="64" y1="285.7" x2="696" y2="285.7"/>
<text class="tick" x="56" y="289.7" text-anchor="end">2.4</text>
<line class="grid" x1="64" y1="246.6" x2="696" y2="246.6"/>
<text class="tick" x="56" y="250.6" text-anchor="end">2.8</text>
<line class="grid" x1="64" y1="207.4" x2="696" y2="207.4"/>
<text class="tick" x="56" y="211.4" text-anchor="end">3.2</text>
<line class="grid" x1="64" y1="168.3" x2="696" y2="168.3"/>
<text class="tick" x="56" y="172.3" text-anchor="end">3.6</text>
<line class="grid" x1="64" y1="129.1" x2="696" y2="129.1"/>
<text class="tick" x="56" y="133.1" text-anchor="end">4</text>
<line class="grid" x1="64" y1="90" x2="696" y2="90"/>
<text class="tick" x="56" y="94" text-anchor="end">4.4</text>
<line class="base" x1="64" y1="364" x2="64" y2="368"/>
<text class="tick" x="64" y="382" text-anchor="middle">80</text>
<line class="base" x1="169.3" y1="364" x2="169.3" y2="368"/>
<text class="tick" x="169.3" y="382" text-anchor="middle">110</text>
<line class="base" x1="274.7" y1="364" x2="274.7" y2="368"/>
<text class="tick" x="274.7" y="382" text-anchor="middle">140</text>
<line class="base" x1="380" y1="364" x2="380" y2="368"/>
<text class="tick" x="380" y="382" text-anchor="middle">170</text>
<line class="base" x1="485.3" y1="364" x2="485.3" y2="368"/>
<text class="tick" x="485.3" y="382" text-anchor="middle">200</text>
<line class="base" x1="590.7" y1="364" x2="590.7" y2="368"/>
<text class="tick" x="590.7" y="382" text-anchor="middle">230</text>
<line class="base" x1="696" y1="364" x2="696" y2="368"/>
<text class="tick" x="696" y="382" text-anchor="middle">260</text>
<text class="axt" x="380" y="406" text-anchor="middle">Speed (km/h)</text>
<text class="axt" transform="translate(16 227) rotate(-90)" text-anchor="middle">Lateral acceleration (g)</text>
