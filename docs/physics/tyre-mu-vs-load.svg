<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Peak friction coefficient vs vertical load</title>
<desc id="d">Peak lateral friction coefficient of the soft front tyre of the GT3, the f12026-car and the LC26 from 0.5 to 10 kN. All three fall as the load rises, the property that makes weight transfer cost grip.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--r1:#86b6ef;--r2:#3987e5;--r3:#1c5cab;--r4:#0d366b;--mutedSeries:#898781;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--r1:#1c5cab;--r2:#3987e5;--r3:#86b6ef;--r4:#cde2fb;--mutedSeries:#898781;}}
.ttl{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2);font-size:12px}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.axt{fill:var(--ink2);font-size:12px}
.lbl{fill:var(--ink);font-size:11px}.leg{fill:var(--ink2);font-size:12px}
.grid{stroke:var(--grid);stroke-width:1}.base{stroke:var(--axis);stroke-width:1}
</style>
<rect width="720" height="420" rx="8" fill="var(--surface)"/>
<text class="ttl" x="64" y="28">Peak friction coefficient vs vertical load</text>
<text class="sub" x="64" y="48">Soft front tyre of each car at its optimum; the drop with load is load sensitivity</text>
<line x1="64" y1="70" x2="80" y2="70" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="86" y="74">GT3</text>
<line x1="124.88" y1="70" x2="140.88" y2="70" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="146.88" y="74">f12026-car</text>
<line x1="234.48" y1="70" x2="250.48" y2="70" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/>
<text class="leg" x="256.48" y="74">LC26</text>
<line class="base" x1="64" y1="364" x2="640.2" y2="364"/>
<text class="tick" x="56" y="368" text-anchor="end">1.2</text>
<line class="grid" x1="64" y1="324.9" x2="640.2" y2="324.9"/>
<text class="tick" x="56" y="328.9" text-anchor="end">1.4</text>
<line class="grid" x1="64" y1="285.7" x2="640.2" y2="285.7"/>
<text class="tick" x="56" y="289.7" text-anchor="end">1.6</text>
<line class="grid" x1="64" y1="246.6" x2="640.2" y2="246.6"/>
<text class="tick" x="56" y="250.6" text-anchor="end">1.8</text>
<line class="grid" x1="64" y1="207.4" x2="640.2" y2="207.4"/>
<text class="tick" x="56" y="211.4" text-anchor="end">2</text>
<line class="grid" x1="64" y1="168.3" x2="640.2" y2="168.3"/>
<text class="tick" x="56" y="172.3" text-anchor="end">2.2</text>
<line class="grid" x1="64" y1="129.1" x2="640.2" y2="129.1"/>
<text class="tick" x="56" y="133.1" text-anchor="end">2.4</text>
<line class="grid" x1="64" y1="90" x2="640.2" y2="90"/>
<text class="tick" x="56" y="94" text-anchor="end">2.6</text>
<line class="base" x1="64" y1="364" x2="64" y2="368"/>
<text class="tick" x="64" y="382" text-anchor="middle">0</text>
<line class="base" x1="179.2" y1="364" x2="179.2" y2="368"/>
<text class="tick" x="179.2" y="382" text-anchor="middle">2</text>
<line class="base" x1="294.5" y1="364" x2="294.5" y2="368"/>
<text class="tick" x="294.5" y="382" text-anchor="middle">4</text>
<line class="base" x1="409.7" y1="364" x2="409.7" y2="368"/>
<text class="tick" x="409.7" y="382" text-anchor="middle">6</text>
<line class="base" x1="525" y1="364" x2="525" y2="368"/>
<text class="tick" x="525" y="382" text-anchor="middle">8</text>
<line class="base" x1="640.2" y1="364" x2="640.2" y2="368"/>
<text class="tick" x="640.2" y="382" text-anchor="middle">10</text>
<text class="axt" x="352.1" y="406" text-anchor="middle">Vertical load (kN)</text>
<text class="axt" transform="translate(16 227) rotate(-90)" text-anchor="middle">Peak lateral μ</text>
