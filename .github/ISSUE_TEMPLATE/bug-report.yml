# Opened pre-filled from the in-game Feedback panel (src/components/menu/RequestPanel.tsx): GitHub only pre-fills
# text fields from the URL, so circuit, car, input, graphics, game details and errors are plain text fields the game
# fills in for the player.
name: Bug report
description: Something broken, crashing or behaving wrong in the sim
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more exact the steps, the faster it gets fixed.
        - **Ideas & feature requests** belong in [Discussions → Ideas](https://github.com/librecorsa/librecorsa/discussions/new?category=ideas), not bug reports.
        - **Check open issues first** so we don't end up with duplicates. Reports without clear reproduction steps will be flagged for more info and auto-closed if unanswered.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe clearly what broke and what you expected instead (at least a full sentence).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps we can follow to see the bug ourselves. Please don't write "idk" or copy the title.
      placeholder: |
        1. Drive at Suzuka in the FA-26 Prototype
        2. Brake hard into turn 1
        3. …
    validations:
      required: true
  - type: input
    id: circuit
    attributes:
      label: Circuit
      description: Filled in when you report from the game. "Any / menus" if it isn't on track.
  - type: input
    id: car
    attributes:
      label: Car
      description: Filled in when you report from the game. "Any" if it isn't car related.
  - type: input
    id: input
    attributes:
      label: Input device
      placeholder: Keyboard, gamepad, touch screen, wheel (WebHID) or wheel (FFB bridge)
  - type: input
    id: hardware
    attributes:
      label: Wheel or controller model
      description: For example Moza R9, Logitech G29, Xbox Series pad. Leave empty for keyboard or touch.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 140 on Windows 11, Safari on iPhone 15…
    validations:
      required: true
  - type: input
    id: quality
    attributes:
      label: Graphics
      placeholder: Low, Medium or High, plus render resolution
  - type: textarea
    id: details
    attributes:
      label: Game details
      description: Filled in when you report from the game (the build, where you were on track, frame rate, settings).
      render: text
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Filled in from the game's own error log when you report from the game. Otherwise, if you can, open the browser console (F12) and paste any red errors.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Paste the screenshot the game copied (Ctrl+V or Cmd+V), or drag files in here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open issues to make sure this isn't already reported.
          required: true
        - label: This is a bug report (not a feature idea or car/track request) and includes reproduction steps.
          required: true
