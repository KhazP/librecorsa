# Opened (pre-filled) from the Feedback panel on the title menu (Car / Track): the field ids below are the
# query parameters src/components/menu/RequestPanel.tsx fills in. GitHub only pre-fills text fields from the URL,
# so the choices the panel offers as dropdowns are plain inputs here.
name: Car or track request
description: Ask for a car or circuit to be added to LibreCorsa (requires an eligible model + license or modder permission)
title: "[Request] "
labels: ["content-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! LibreCorsa can only ship models it is legally allowed to redistribute:
        an open license (**CC BY**, **CC BY-SA**, **CC0**, **CC BY-NC**, **CC BY-NC-SA**) or **explicit written permission from the original creator**.

        **Requests will be automatically closed if:**
        - The link is from a **mod reupload / piracy site** (such as `assettoworld.com`, `assettolab.ru`, `assettocorsa.club`, `modland.net`, etc.), a direct file host (`mega.nz`, `drive.google.com`, `sharemods.com`…), or a paid 3D store.
        - The model is ripped from another game (Assetto Corsa, ACC, iRacing, Forza, Gran Turismo, F1 games…) without the original creator's permission.
        - You haven't asked the creator yet or there is no open license / written permission attached.
        - **Sketchfab:** models tagged "Ripped" or "Assetto Corsa" aren't accepted.
        - **OverTake mods:** ask the modder for permission first, and only open a request once they've said yes.

        *(Tip: if you just want to drive an unencrypted Assetto Corsa mod privately, the LibreCorsa desktop app lets you import it locally for offline hotlapping.)*
  - type: input
    id: kind
    attributes:
      label: Car or track?
      placeholder: Track or Car
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: What would you like?
      description: Name, plus the year or layout (e.g. "Spa-Francorchamps, 2022 layout" or "Porsche 911 GT3 R 2023").
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Model link
      description: "URL to the **original creator's** page (OverTake, Sketchfab, creator's site, GitHub…). Do NOT link reupload/piracy sites or direct file hosts."
      placeholder: https://
    validations:
      required: true
  - type: input
    id: modders
    attributes:
      label: Asked the modders?
      description: "OverTake mods: did the modder say yes? Sketchfab links: did you ask sim modders for permission first, and did they say no?"
  - type: input
    id: creator
    attributes:
      label: Creator / modder
      description: Name or handle of the original creator (not a commercial game or studio like ACC, Kunos, or iRacing).
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: "Exact license stated on the creator's page (CC BY / CC BY-SA, CC0 / public domain, CC BY-NC / CC BY-NC-SA, or Other license with written permission)."
    validations:
      required: true
  - type: input
    id: permission
    attributes:
      label: Permission to use it
      description: '"The license allows it" (only for open Creative Commons / CC0 licenses) or "The creator gave written permission" (attach proof below).'
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Link or screenshot of the creator's written permission (required if not an open CC license), why it would be fun, reference photos…
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The link above is the original creator's page (not a reupload/piracy site or direct download host).
          required: true
        - label: This model either has an open Creative Commons / CC0 license OR I have written permission from the creator attached above.
          required: true
