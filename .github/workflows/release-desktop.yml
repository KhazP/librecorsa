name: Release Apps

on:
  push:
    tags:
      - "desktop-v*"
  # A manual run builds and signs but never publishes a release, which is how SignPath test signing is checked.
  workflow_dispatch:
    inputs:
      signing_policy:
        description: SignPath signing policy for the Windows installer
        type: choice
        options:
          - test-signing
          - release-signing
          - none
        default: test-signing

permissions:
  contents: read

env:
  SIGNPATH_ORGANIZATION_ID: 915def1d-d8da-483d-9c78-1533563d92de
  SIGNPATH_PROJECT_SLUG: librecorsa

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # SignPath reads this run's job details and downloads the unsigned installer artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            target_flag: --mac
          - os: windows-latest
            platform: win
            target_flag: --win
          - os: ubuntu-latest
            platform: linux
            target_flag: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check desktop wrapper
        working-directory: desktop
        run: npm run check

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build installer (${{ matrix.platform }})
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ "${{ matrix.platform }}" = "mac" ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ matrix.platform }}" = "win" ] && [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.target_flag }} --publish never

      # Tag builds are signed with release-signing once the repository variable SIGNPATH_SIGN_RELEASES is "true",
      # which waits for SignPath's production certificate. Until then a tag build ships unsigned, as before.
      # The version goes to SignPath, whose artifact configuration only signs an installer whose product version
      # matches it (SignPath Foundation requires product name and version restrictions).
      - name: Pick SignPath signing policy
        id: signing
        if: matrix.platform == 'win'
        shell: bash
        env:
          DISPATCH_POLICY: ${{ inputs.signing_policy }}
          SIGN_RELEASES: ${{ vars.SIGNPATH_SIGN_RELEASES }}
        run: |
          policy=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_POLICY" != "none" ]; then policy="$DISPATCH_POLICY"; fi
          elif [ "$SIGN_RELEASES" = "true" ]; then
            policy="release-signing"
          fi
          version="$(node -p "require('./desktop/package.json').version")"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SignPath policy: ${policy:-none, the installer stays unsigned} (version $version)"

      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: steps.signing.outputs.policy != ''
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-win
          path: desktop/dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 1

      # release-signing waits for an approver in SignPath, so the wait is an hour instead of the default 10 minutes.
      - name: Sign installer with SignPath
        if: steps.signing.outputs.policy != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/dist-signed
          parameters: |
            version: ${{ toJSON(steps.signing.outputs.version) }}

      # Signing changes the installer's bytes, so the block map and latest.yml electron-builder wrote are rebuilt
      # from the signed file. Without this, installed copies reject the update as a checksum mismatch.
      - name: Use signed installer and rebuild update files
        if: steps.signing.outputs.policy != ''
        working-directory: desktop
        shell: bash
        run: |
          shopt -s nullglob
          signed=(dist-signed/*-Setup.exe)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::SignPath returned ${#signed[@]} installers, expected 1"
            exit 1
          fi
          name="$(basename "${signed[0]}")"
          if [ ! -f "dist/$name" ]; then
            echo "::error::dist/$name is missing"
            exit 1
          fi
          cp "${signed[0]}" "dist/$name"
          node scripts/refresh-update-info.js "dist/$name" dist/latest.yml

      - name: Check installer signature
        if: steps.signing.outputs.policy != ''
        working-directory: desktop
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist/*-Setup.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if (-not $signature.SignerCertificate) {
              Write-Error "$($file.Name) has no Authenticode signature"
              exit 1
            }
            # A test-signed installer reports an untrusted root here; the subject shows which certificate signed it.
            "$($file.Name): signed by $($signature.SignerCertificate.Subject) ($($signature.Status))"
          }

      - name: Upload release files (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  build-android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Android APK
        id: apk
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIBRECORSA_ANDROID_KEYSTORE_BASE64 }}
          LIBRECORSA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LIBRECORSA_ANDROID_KEYSTORE_PASSWORD }}
          LIBRECORSA_ANDROID_KEY_ALIAS: ${{ secrets.LIBRECORSA_ANDROID_KEY_ALIAS }}
          LIBRECORSA_ANDROID_KEY_PASSWORD: ${{ secrets.LIBRECORSA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi

          if [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="$(node -p "require('../desktop/package.json').version")"
          fi
          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            export LIBRECORSA_ANDROID_VERSION_NAME="$VERSION"
            export LIBRECORSA_ANDROID_VERSION_CODE="$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))"
          fi

          KEYSTORE_FILE=""
          SIGNED=0
          trap 'rm -f "${KEYSTORE_FILE:-}"' EXIT

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${LIBRECORSA_ANDROID_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${LIBRECORSA_ANDROID_KEY_ALIAS:-}" ] && [ -n "${LIBRECORSA_ANDROID_KEY_PASSWORD:-}" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/librecorsa-upload.jks"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            export LIBRECORSA_ANDROID_KEYSTORE="$KEYSTORE_FILE"
            SIGNED=1
          fi

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          mkdir -p dist
          if [ "$SIGNED" = "1" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKSIGNER="$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" verify --verbose "$APK"
            cp "$APK" "dist/LibreCorsa-${VERSION}-android.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets (LIBRECORSA_ANDROID_KEYSTORE_BASE64, LIBRECORSA_ANDROID_KEYSTORE_PASSWORD, LIBRECORSA_ANDROID_KEY_ALIAS, LIBRECORSA_ANDROID_KEY_PASSWORD) are unset; skipping unsigned APK upload because Android cannot install unsigned APKs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK
        if: steps.apk.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          path: android/dist/*.apk

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token gets the Sigstore signing certificate, attestations stores the result
      id-token: write
      attestations: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/release-notes.md
          sparse-checkout-cone-mode: false

      # Exclude signpath-unsigned-win (the pre-signing Windows installer) by downloading desktop-* and android-apk explicitly.
      - name: Download desktop release files
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Download Android APK (if signed)
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: android-apk
          merge-multiple: true

      # A signed SLSA build provenance attestation for each file people download (the Windows installer after
      # SignPath signed it), so anyone can check a file came from this workflow at this tag:
      #   gh attestation verify <file> -R librecorsa/librecorsa
      # A failure here leaves the release to go out without it rather than stopping the release.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.apk

      # The gh CLI on the runner, not a third-party action: the repository allows GitHub's own actions plus the
      # SignPath one only, and any other action stops the whole run before it starts. The notes file comes first,
      # then GitHub's notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LibreCorsa ($GITHUB_REF_NAME)" \
            --notes-file desktop/release-notes.md \
            --generate-notes
