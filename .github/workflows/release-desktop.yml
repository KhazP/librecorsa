name: Release Apps

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            target_flag: --mac
          - os: windows-latest
            platform: win
            target_flag: --win
          - os: ubuntu-latest
            platform: linux
            target_flag: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check desktop wrapper
        working-directory: desktop
        run: npm run check

      - name: Sync version from tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build installer (${{ matrix.platform }})
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ "${{ matrix.platform }}" = "mac" ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ matrix.platform }}" = "win" ] && [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.target_flag }} --publish never

      - name: Upload release files (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  build-android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Android APK
        id: apk
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIBRECORSA_ANDROID_KEYSTORE_BASE64 }}
          LIBRECORSA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LIBRECORSA_ANDROID_KEYSTORE_PASSWORD }}
          LIBRECORSA_ANDROID_KEY_ALIAS: ${{ secrets.LIBRECORSA_ANDROID_KEY_ALIAS }}
          LIBRECORSA_ANDROID_KEY_PASSWORD: ${{ secrets.LIBRECORSA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi

          VERSION="${GITHUB_REF_NAME#desktop-v}"
          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            export LIBRECORSA_ANDROID_VERSION_NAME="$VERSION"
            export LIBRECORSA_ANDROID_VERSION_CODE="$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))"
          fi

          KEYSTORE_FILE=""
          SIGNED=0
          trap 'rm -f "${KEYSTORE_FILE:-}"' EXIT

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${LIBRECORSA_ANDROID_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${LIBRECORSA_ANDROID_KEY_ALIAS:-}" ] && [ -n "${LIBRECORSA_ANDROID_KEY_PASSWORD:-}" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/librecorsa-upload.jks"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            export LIBRECORSA_ANDROID_KEYSTORE="$KEYSTORE_FILE"
            SIGNED=1
          fi

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          mkdir -p dist
          if [ "$SIGNED" = "1" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKSIGNER="$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" verify --verbose "$APK"
            cp "$APK" "dist/LibreCorsa-${VERSION}-android.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets (LIBRECORSA_ANDROID_KEYSTORE_BASE64, LIBRECORSA_ANDROID_KEYSTORE_PASSWORD, LIBRECORSA_ANDROID_KEY_ALIAS, LIBRECORSA_ANDROID_KEY_PASSWORD) are unset; skipping unsigned APK upload because Android cannot install unsigned APKs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK
        if: steps.apk.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          path: android/dist/*.apk

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/release-notes.md
          sparse-checkout-cone-mode: false

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The gh CLI on the runner, not a third-party action: the repository allows GitHub's own actions only, and
      # a third-party one stops the whole run before it starts. The notes file comes first, then GitHub's notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LibreCorsa ($GITHUB_REF_NAME)" \
            --notes-file desktop/release-notes.md \
            --generate-notes
