name: Issue triage

on:
  issues:
    types: [opened, edited]
  schedule:
    # Close unanswered `needs-more-info` and `question` issues once a day
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules and triage script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/issue_triage.mjs
            src/lib/feedback/request-rules.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Triage issue
        uses: actions/github-script@v7
        with:
          script: |
            const { triageIssue } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue_triage.mjs`);
            const issue = context.payload.issue;
            if (!issue || issue.state !== "open") return;

            const labels = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name)).filter(Boolean);
            const verdict = triageIssue({
              title: issue.title,
              body: issue.body,
              labels,
              authorAssociation: issue.author_association,
            });

            core.info(`Issue #${issue.number}: action=${verdict.action} reason=${verdict.reason}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            if (verdict.action === "ok") {
              if (context.payload.action === "edited" && labels.some((l) => l.toLowerCase() === "needs-more-info")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "needs-more-info" }).catch(() => {});
              }
              return;
            }

            // Ensure target labels exist before applying them
            const labelColors = {
              "invalid-source": "b60205",
              "needs-permission": "d93f0b",
              "needs-more-info": "fbca04",
            };
            for (const name of verdict.addLabels) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: labelColors[name] || "ededed",
              }).catch(() => {});
            }
            if (verdict.addLabels.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: verdict.addLabels });
            }

            // Avoid posting duplicate bot comments on repeated edits
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const alreadyCommented = verdict.marker && comments.some((c) => (c.body || "").includes(verdict.marker));
            if (verdict.comment && !alreadyCommented) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: verdict.comment });
            }

            if (verdict.action === "close") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: verdict.closeReason || "not_planned",
              });
            }

  stale-questions:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Close unanswered needs-more-info and question issues
        uses: actions/stale@v9
        with:
          only-labels: "needs-more-info,question"
          days-before-issue-stale: 7
          days-before-issue-close: 3
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: "stale"
          stale-issue-message: "Closing this issue in 3 days if there is no reply with the requested details. Feel free to comment whenever you have them!"
          close-issue-message: "Closing due to inactivity after requesting more information. Feel free to comment or reopen once you have the details."
          close-issue-reason: "not_planned"
          exempt-issue-labels: "help wanted,long-term,pinned"
