name: Deploy to librecorsa.org

# The game is served by Cloudflare at https://librecorsa.org (wrangler.jsonc). The old GitHub Pages address,
# https://khazp.github.io/librecorsa/, keeps a redirect page (cloudflare/old-site-redirect.html) so old links,
# bookmarks and articles still land on the game, with the player's saved data carried over.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify suites
        run: npm run verify

  cloudflare:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://librecorsa.org
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cloudflare serves files up to 25 MiB; fail here with the file names rather than halfway through the upload
      - name: Check file sizes
        run: |
          big=$(find public -type f -size +26214400c)
          if [ -n "$big" ]; then echo "Over Cloudflare's 25 MiB per-file limit:"; ls -l $big; exit 1; fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # Online leaderboard (scripts/leaderboard-supabase); repository variables, empty = local board only
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy
          npx wrangler deploy -c cloudflare/www/wrangler.jsonc

  redirect:
    runs-on: ubuntu-latest
    needs: cloudflare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the redirect page
        run: |
          mkdir _site
          cp cloudflare/old-site-redirect.html _site/index.html
          cp cloudflare/old-site-redirect.html _site/404.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
