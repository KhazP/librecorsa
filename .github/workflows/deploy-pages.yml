name: Deploy to librecorsa.org

# The game is served by Cloudflare at https://librecorsa.org (wrangler.jsonc). The old GitHub Pages address,
# https://khazp.github.io/librecorsa/, keeps a redirect page (cloudflare/old-site-redirect.html) so old links,
# bookmarks and articles still land on the game, with the player's saved data carried over.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify suites
        run: npm run verify

  cloudflare:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://librecorsa.org
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The repository keeps the default car's raw GLB the authoring scripts edit; the site ships it
      # meshopt-compressed (16 → 6 MB). RISE Motordrome's model is compressed when it is built
      # (scripts/rwanda-official/post.mjs); its foliage stays raw: it is instance transforms and textures,
      # which meshopt makes bigger, not smaller.
      - name: Compress models for the download
        run: |
          node scripts/compress-car-glb.mjs --all

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # The online side served by this site's Worker (cloudflare/api): room codes, relay servers, lap boards
          NEXT_PUBLIC_ONLINE_API: "/api"
          # List every car and circuit: the ones not in the repository are served from R2 (src/lib/hosted-content.ts)
          NEXT_PUBLIC_HOSTED_CONTENT: "1"
          # The build's commit, in a meta tag the anonymous usage totals read (the first seven digits; src/app/layout.tsx)
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
        run: npm run build

      # Cloudflare's asset store takes files up to 25 MiB. Bigger ones (large circuit GLBs) go to the
      # librecorsa-assets R2 bucket under the same path, and cloudflare/worker.js serves them from there.
      - name: Move files over 25 MiB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find out -type f -size +26214400c | while read -r f; do
            key="${f#out/}"
            case "$f" in *.glb) type=model/gltf-binary ;; *) type=$(file -b --mime-type "$f") ;; esac
            echo "R2: $key ($(stat -c %s "$f") bytes, $type)"
            npx wrangler r2 object put "librecorsa-assets/$key" --file "$f" --content-type "$type" --remote < /dev/null
            rm "$f"
          done

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The lap boards' tables first (cloudflare/migrations; nothing to do when they are up to date). The token
          # needs D1 edit rights as well as Workers'
          npx wrangler d1 migrations apply librecorsa-board --remote
          npx wrangler deploy
          npx wrangler deploy -c cloudflare/www/wrangler.jsonc

  redirect:
    runs-on: ubuntu-latest
    needs: cloudflare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the redirect page
        run: |
          mkdir _site
          cp cloudflare/old-site-redirect.html _site/index.html
          cp cloudflare/old-site-redirect.html _site/404.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages can stay queued for several minutes even with a valid artifact; avoid failing at the
          # default 10-minute action timeout while waiting for the deployment slot.
          timeout: "1800000"
