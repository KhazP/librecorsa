name: Deploy docs.librecorsa.org

# The docs site (docs-site/, built from the Markdown in docs/) is its own Worker, deployed apart from the game so a
# docs build can't hold a game deploy back, or the other way round. Only a push that changes a published page, the
# site or the logo runs it.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "public/branding/librecorsa-*.svg"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-docs"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
